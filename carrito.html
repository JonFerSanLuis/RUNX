<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Carrito de compra BRAND NAME."><title>Carrito | BRAND NAME</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><link href="css/responsive.css" rel="stylesheet"></head><body><div data-site-header></div><main><section class="page-hero"><div class="container"><p class="eyebrow">Tu selección</p><h1 class="display-4">Carrito</h1></div></section><section class="container section-pad" data-cart-content></section></main><div data-site-footer></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/products.js"></script><script src="js/cart.js"></script><script src="js/main.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{renderCart();document.addEventListener('click',e=>{const remove=e.target.closest('[data-remove-cart]');if(remove)removeFromCart(remove.dataset.removeCart);if(e.target.closest('[data-clear-cart]'))clearCart();const qty=e.target.closest('[data-change-qty]');if(qty){const item=getCart().find(i=>i.key===qty.dataset.changeQty);if(item)updateQuantity(item.key,item.quantity+Number(qty.dataset.delta));}})})</script></body></html>
