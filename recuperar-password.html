<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Recuperar contraseña BRAND NAME.">
  <title>Recuperar contraseña | BRAND NAME</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body>
  <div data-site-header></div>
  <main class="container section-pad">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <p class="eyebrow">Área personal</p>
        <h1 class="display-6 fw-bold">Recuperar contraseña</h1>
        <p class="text-secondary">Indica tu correo electrónico y te enviaremos las instrucciones para restablecer tu acceso.</p>
        <form data-forgot-password-form novalidate>
          <div data-form-message></div>
          <label class="form-label" for="resetEmail">Email de tu cuenta</label>
          <input id="resetEmail" name="email" type="email" class="form-control mb-4" autocomplete="email" required placeholder="tu@email.com">
          <button class="btn btn-primary w-100" type="submit">Enviar enlace de recuperación</button>
        </form>
        <p class="text-center small mt-4">¿Te acuerdas de tu contraseña? <a class="fw-bold" href="login.html">Iniciar sesión</a></p>
      </div>
    </div>
  </main>
  <div data-site-footer></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
