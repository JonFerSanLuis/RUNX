<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Elegir nueva contraseña BRAND NAME.">
  <title>Restablecer contraseña | BRAND NAME</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body>
  <div data-site-header></div>
  <main class="container section-pad">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <p class="eyebrow">Área personal</p>
        <h1 class="display-6 fw-bold">Elegir nueva contraseña</h1>
        <p class="text-secondary">Introduce una nueva contraseña segura para tu cuenta.</p>
        <form data-reset-password-form novalidate>
          <div data-form-message></div>
          <input type="hidden" name="token" id="resetToken">
          <input type="hidden" name="email" id="resetUserEmail">

          <label class="form-label" for="newPass">Nueva contraseña</label>
          <input id="newPass" name="password" type="password" class="form-control mb-2" autocomplete="new-password" minlength="8" required>
          <p class="form-text mb-3">Mínimo 8 caracteres.</p>

          <label class="form-label" for="newPassConfirmation">Confirmar nueva contraseña</label>
          <input id="newPassConfirmation" name="password_confirmation" type="password" class="form-control mb-4" autocomplete="new-password" minlength="8" required>
          <div class="invalid-feedback">Las contraseñas deben coincidir.</div>

          <button class="btn btn-primary w-100" type="submit">Actualizar contraseña</button>
        </form>
        <p class="text-center small mt-4"><a class="fw-bold" href="login.html">Volver a iniciar sesión</a></p>
      </div>
    </div>
  </main>
  <div data-site-footer></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
