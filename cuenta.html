<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Área de cuenta BRAND NAME."><title>Mi cuenta | BRAND NAME</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body><div data-site-header></div><main data-account-page hidden><section class="page-hero"><div class="container"><p class="eyebrow">Área personal</p><h1 class="display-4">Mi cuenta</h1><p class="text-secondary mb-0">Consulta y gestiona los datos de tu cuenta.</p></div></section><section class="container section-pad"><div class="row g-5"><aside class="col-md-3"><div class="list-group account-menu"><a href="#personal" class="list-group-item list-group-item-action active">Información personal</a><a href="#orders" class="list-group-item list-group-item-action">Mis pedidos</a><a href="#password" class="list-group-item list-group-item-action">Cambiar contraseña</a><button type="button" class="list-group-item list-group-item-action text-danger" data-request-logout>Cerrar sesión</button></div></aside><div class="col-md-9"><section id="personal" class="mb-5"><h2 class="h3">Información personal</h2><p class="text-secondary mb-1"><span class="fw-semibold">Nombre:</span> <span data-user-name></span></p><p class="text-secondary mb-4"><span class="fw-semibold">Email:</span> <span data-user-email></span></p><h3 class="h5">Editar perfil</h3><form data-profile-form class="mt-3" novalidate><label class="form-label" for="profileName">Nombre</label><input id="profileName" name="name" data-profile-name class="form-control mb-3" maxlength="120" required><button class="btn btn-outline-dark">Guardar cambios</button></form></section><section id="orders" class="mb-5"><h2 class="h3">Mis pedidos</h2><div data-orders-list><p class="text-secondary mb-0">Cargando pedidos…</p></div></section><section id="password"><h2 class="h3">Cambiar contraseña</h2><form data-password-form class="mt-3" novalidate><label class="form-label" for="currentPassword">Contraseña actual</label><input id="currentPassword" name="current_password" type="password" class="form-control mb-3" autocomplete="current-password" required><label class="form-label" for="newPassword">Nueva contraseña</label><input id="newPassword" name="new_password" type="password" class="form-control mb-2" autocomplete="new-password" minlength="8" required><p class="form-text mb-3">Mínimo 8 caracteres.</p><label class="form-label" for="newPasswordConfirmation">Confirmar nueva contraseña</label><input id="newPasswordConfirmation" name="password_confirmation" type="password" class="form-control mb-3" autocomplete="new-password" minlength="8" required><div class="invalid-feedback">Las nuevas contraseñas deben coincidir.</div><button class="btn btn-primary">Actualizar contraseña</button></form></section></div></div></section></main><div data-site-footer></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/products.js"></script><script src="js/cart.js"></script><script src="js/main.js"></script><script src="js/order.js"></script></body></html>
